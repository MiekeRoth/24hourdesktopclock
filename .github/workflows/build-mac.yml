name: Bouw Mac Versie

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Haal broncode op
        uses: actions/checkout@v4

      - name: Installeer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Installeer Rust (Apple Silicon + Intel)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Installeer npm-pakketten
        run: npm ci

      - name: Bouw Universal macOS app
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Upload DMG installatiebestand
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-installer
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error